version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: texvision-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: texvision_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: texvision-backend
    ports:
      - "3000:3000"
      - "4001:4001"
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/texvision_ai?schema=public"
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
      JWT_EXPIRES_IN: "7d"
      PORT: "3000"
      SOCKET_PORT: "4001"
      CORS_ORIGIN: "http://localhost:5173"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./public/uploads:/app/public/uploads

volumes:
  postgres_data:
